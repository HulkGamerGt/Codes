<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Applenime</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <h1>Applenime</h1>
        <nav>
            <ul>
                <li><a href="#">Inicio</a></li>
                <li><a href="#">Productos</a></li>
                <li><a href="#">Acerca de</a></li>
                <li><a href="#">Contacto</a></li>
                <li><a href="http://instagram.com/applenime/" class="boton-instagram" target="_blank">Instagram</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="destacados">
            <h2>Productos Destacados</h2>
            <div class="productos-grid">
                <div class="producto">
                    <img src="https://via.placeholder.com/300" alt="Producto 1">
                    <h3>Producto 1</h3>
                    <p>€25.00</p>
                    <button>Añadir al carrito</button>
                </div>
                <div class="producto">
                    <img src="https://via.placeholder.com/300" alt="Producto 2">
                    <h3>Producto 2</h3>
                    <p>€40.00</p>
                    <button>Añadir al carrito</button>
                </div>
                <div class="producto">
                    <img src="https://via.placeholder.com/300" alt="Producto 3">
                    <h3>Producto 3</h3>
                    <p>€15.00</p>
                    <button>Añadir al carrito</button>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 Applenime. Todos los derechos reservados.</p>
    </footer>

</body>
</html>
